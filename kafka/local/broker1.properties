# Broker 1 + KRaft controller (VM2 role), single-machine test version.
# Both brokers run on one host here, so broker 2 uses port 9094 and its own
# log directory. See kafka/vm/ for the per-VM templates.

process.roles=broker,controller
node.id=1
controller.quorum.voters=1@localhost:9093

listeners=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
advertised.listeners=PLAINTEXT://localhost:9092
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
controller.listener.names=CONTROLLER
inter.broker.listener.name=PLAINTEXT

log.dirs=/tmp/kafka-data/broker1

# Topics are created explicitly by kafka/topics.sh (2 partitions, RF 2).
auto.create.topics.enable=false
num.partitions=2
default.replication.factor=2
min.insync.replicas=1

# Internal topics are replicated on both brokers so consumers keep working
# while broker 2 is stopped.
offsets.topic.replication.factor=2
transaction.state.log.replication.factor=2
transaction.state.log.min.isr=1

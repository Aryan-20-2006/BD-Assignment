# VM3: Kafka broker 2 (broker only). Joins VM2's cluster; do NOT generate a
# new cluster id here - format with the id created on VM2.
# Replace VM2_ADDRESS and VM3_ADDRESS with the reachable IPs before use.

process.roles=broker
node.id=2
controller.quorum.voters=1@VM2_ADDRESS:9093

listeners=PLAINTEXT://0.0.0.0:9092
advertised.listeners=PLAINTEXT://VM3_ADDRESS:9092
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
controller.listener.names=CONTROLLER
inter.broker.listener.name=PLAINTEXT

log.dirs=/var/lib/kafka/data

auto.create.topics.enable=false
min.insync.replicas=1

offsets.topic.replication.factor=2
transaction.state.log.replication.factor=2
transaction.state.log.min.isr=1
